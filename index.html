        :root {
            --bg: #f4efe7;
            --ink: #1c1915;
            --muted: #615b53;
            --line: #e6ddd0;
            --card: rgba(255, 252, 248, 0.92);
            --accent: #c2410c;
            --accent-soft: #fff1e8;
            --green: #166534;
            --green-soft: #ecf8f1;
            --amber: #92400e;
            --amber-soft: #fff7eb;
            --shadow: 0 20px 50px rgba(58, 36, 14, 0.07);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Outfit, sans-serif;
            color: var(--ink);
            line-height: 1.6;
            min-height: 100vh;
            background:
                radial-gradient(900px 420px at -10% -10%, #ffd8bf 0%, transparent 60%),
                radial-gradient(800px 380px at 110% -20%, #efe4ff 0%, transparent 55%),
                var(--bg);
            padding: 28px 18px 80px;
        }

        .container { max-width: 920px; margin: 0 auto; }

        .hero { padding: 18px 6px 8px; }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 14px;
        }

        h1 {
            font-family: Fraunces, serif;
            font-size: clamp(2.6rem, 6vw, 4.4rem);
            font-weight: 560;
            letter-spacing: -0.045em;
            line-height: 0.95;
            color: var(--ink);
            max-width: 12ch;
        }

        .subtitle {
            margin-top: 18px;
            max-width: 42rem;
            font-size: 1.12rem;
            color: var(--muted);
        }

        .tabs {
            position: sticky;
            top: 14px;
            z-index: 20;
            display: flex;
            gap: 6px;
            width: fit-content;
            max-width: 100%;
            margin: 28px 0 22px;
            padding: 6px;
            background: rgba(255, 252, 248, 0.82);
            border: 1px solid var(--line);
            border-radius: 999px;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 24px rgba(58, 36, 14, 0.06);
        }

        .tab-btn {
            border: 0;
            background: transparent;
            color: var(--muted);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--ink);
            color: #fffaf5;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .level-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: var(--shadow);
        }

        .level-header {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .level-num {
            flex: 0 0 auto;
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: var(--ink);
            color: #fffaf5;
            font-family: Fraunces, serif;
            font-size: 1.15rem;
        }

        .level-title {
            font-family: Fraunces, serif;
            font-size: 1.7rem;
            font-weight: 560;
            letter-spacing: -0.03em;
            color: var(--ink);
            line-height: 1.1;
        }

        .level-desc { color: var(--muted); margin-top: 4px; }

        .badge {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.82rem;
            font-weight: 600;
        }

        .topic {
            margin-top: 10px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            overflow: hidden;
        }

        .topic-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.02rem;
            color: var(--ink);
        }

        .topic-title:hover { background: #faf7f2; }

        .arrow {
            width: 9px;
            height: 9px;
            border-right: 2px solid #8a8178;
            border-bottom: 2px solid #8a8178;
            transform: rotate(-45deg);
            transition: transform 0.2s ease;
            flex: 0 0 auto;
        }

        .topic.expanded .arrow { transform: rotate(45deg); }

        .topic-content { display: none; padding: 0 16px 16px; }
        .topic.expanded .topic-content { display: block; }

        .explain {
            margin: 2px 0 14px;
            padding: 12px 14px;
            border-radius: 12px;
            background: #f7f3ec;
            color: #2c2824;
            font-size: 0.98rem;
        }
        .q { font-weight: 600; display: block; }
        .answer { margin-top: 4px; color: #4b453e; font-weight: 400; }


        .lesson { margin-top: 14px; padding: 14px 16px 12px; border-radius: 14px; border: 1px solid var(--line); }
        .lesson.example { background: #f3f6fb; }
        .lesson.practice { background: #fff8ef; }
        .lesson.project { background: #f2f7f3; }
        .lesson.watch { background: #f6f3fb; }
        .lesson.watch a { color: #5b21b6; font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }
        .watch-item { margin: 12px 0 4px; }
        .watch-item .why { margin-top: 2px; }
        .lesson p { margin: 8px 0; color: #2c2824; }
        .lesson .meta { color: var(--muted); font-size: 0.92rem; }
        .lesson ol { margin: 8px 0 8px 1.2rem; }
        .lesson ol li { padding: 4px 0 4px 4px; }
        .lesson ol li:before { content: none; }

        .section { margin-top: 14px; }

        .section-title {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .section-title.interview { color: var(--amber); }
        .section-title.tips { color: var(--green); }
        .section-title.aws { color: var(--accent); }

        ul { list-style: none; }

        li {
            position: relative;
            padding: 7px 0 7px 16px;
            color: #2c2824;
        }

        li:before {
            content: "";
            position: absolute;
            left: 0;
            top: 0.85em;
            width: 6px;
            height: 6px;
            border-radius: 99px;
            background: #d6cfc4;
        }

        .interview-q:before { background: #d97706; }
        .tip:before { background: #16a34a; }
        .aws-item:before { background: var(--accent); }

        .aws-box, .when {
            margin-top: 14px;
            padding: 14px 14px 6px;
            border-radius: 14px;
            background: var(--accent-soft);
        }

        .when {
            padding: 12px 14px;
            color: #7c2d12;
            background: var(--green-soft);
            color: var(--green);
        }

        .group-title {
            margin: 26px 0 12px;
            font-family: Fraunces, serif;
            font-size: 1.45rem;
            letter-spacing: -0.03em;
        }

        .service-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .service-name {
            font-family: Fraunces, serif;
            font-size: 1.35rem;
            letter-spacing: -0.03em;
        }

        .service-purpose { color: var(--muted); margin: 2px 0 10px; }

        .label { color: var(--ink); font-weight: 700; }

        .color-blue, .color-green, .color-yellow, .color-red,
        .color-purple, .color-cyan, .color-orange, .color-pink { color: var(--ink); }

        @media (max-width: 700px) {
            body { padding: 16px 12px 48px; }
            .level-card { padding: 16px; border-radius: 18px; }
            .tabs { width: 100%; }
            .tab-btn { flex: 1; }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>

        const conceptNotes = {
  "How computers work: CPU, RAM, Storage hierarchy": "The CPU executes instructions. RAM holds the data those instructions are using right now. Disk and SSD keep data after shutdown. Cache is faster than RAM, RAM is faster than SSD, and SSD is faster than a network call. Put data you touch constantly as close to the CPU as you can afford.",
  "Binary, bits, bytes, and data representation": "Computers store everything as bits, which are 0 or 1. Eight bits make a byte. Numbers, text, images, and model weights are all just bytes with an agreed meaning. A wrong assumption about that meaning, such as text encoding or integer size, corrupts the data even when the file is intact.",
  "Operating systems: processes, threads, memory management": "A process is a running program with its own memory. A thread is a worker inside that process that shares the memory. The OS decides which one runs on the CPU and stops one program from overwriting another. When you run out of RAM, the OS pages memory to disk and everything gets slow.",
  "File systems and I/O operations": "A file system is how the disk is organized into files and folders. Reading and writing files is I/O, and it is slow compared with RAM. Open files, read what you need, and close them. In production, a full disk or a permission error is a common outage, not a rare one.",
  "Network basics: IP, TCP/UDP, HTTP/HTTPS": "IP is the address of a machine. TCP is a reliable connection that resends lost data. UDP is faster and does not guarantee delivery. HTTP is the request and response format of the web, and HTTPS encrypts it. Most APIs you will call are HTTPS over TCP.",
  "Variables, data types, and type systems": "A variable is a name for a value. The type says what you can do with it: add numbers, not add text to a number by accident. A type system catches those mistakes before the program runs, or at least makes them obvious. Pick types that match the real thing, and do not use a decimal float for money.",
  "Control flow: if/else, loops, switch statements": "Control flow is the order of decisions. if/else picks a branch. A loop repeats until a condition fails. A switch picks one case from several. Keep conditions readable. A nest of five ifs is a sign the decision should be a function or a table.",
  "Functions and scope": "A function is a named piece of work with inputs and an output. Scope is where a name can be seen. Names created inside a function stay there unless you return them. Small functions with clear names are how you keep a large program understandable.",
  "Input/Output operations": "Input is data coming in, such as a request, a file, or a keystroke. Output is data going out, such as a response, a log line, or a saved file. Treat every input as untrusted: it can be missing, huge, or malicious. Always decide what happens when the read or write fails.",
  "Debugging and error handling": "An error is the program telling you an assumption broke. Handle the ones you expect, such as a missing file or a timeout, with a clear message and a retry or a failure. Let unexpected errors surface so you can see them. Debugging means reproducing the failure, then checking one assumption at a time.",
  "What is AI, ML, Deep Learning? (The hierarchy)": "AI is the broad goal of software that performs tasks associated with judgment. Machine learning is the subset that learns patterns from examples. Deep learning is machine learning done with neural networks that have many layers. Say which one you mean. A rules engine is AI-ish. A model trained on data is machine learning.",
  "Supervised vs Unsupervised vs Reinforcement Learning": "Supervised learning has labeled answers, such as spam or not spam. Unsupervised learning has no labels and looks for groups or structure. Reinforcement learning learns by trying actions and receiving a reward or a penalty. Most business models are supervised. Clustering customers is unsupervised.",
  "Training data, models, and inference": "Training data is the examples the model learns from. The model is the set of learned numbers that turns an input into a prediction. Inference is using that finished model on a new input. Bad training data produces a bad model no matter how clever the algorithm is.",
  "AI/ML pipeline overview": "A pipeline is the path from raw data to a served prediction: collect, clean, train, evaluate, deploy, and monitor. Each step can fail on its own. In production you version the data and the model so you can explain why today's answers differ from last week's.",
  "Current AI landscape and applications": "Today most applied AI is either classic models on structured data, or foundation models called through an API for text, images, and speech. Companies use them for search, support, classification, and forecasting. The hard part is data, evaluation, and cost, not getting a demo to run once.",
  "Arrays and Lists: dynamic sizing, indexing": "A list stores items in order and lets you get one by its position, which is instant. Adding at the end is cheap. Inserting at the front is expensive because everything else must shift. Use a list when you will walk the items in order.",
  "Stacks and Queues: LIFO vs FIFO": "A stack is last-in, first-out, like a pile of plates. A queue is first-in, first-out, like a line at a store. Stacks show up in undo and in function calls. Queues show up whenever work must be handled in the order it arrived, which is what AWS SQS does.",
  "Hash Tables/Dictionaries: O(1) lookups, collision handling": "A dictionary stores a value under a key and finds it in about one step, regardless of how many keys exist. It does that by turning the key into a slot number. When two keys land in the same slot, that is a collision, and the table keeps both and checks the key. Use a dictionary for lookups by id.",
  "Sets: uniqueness and set operations": "A set stores each value once and answers 'is this here?' very quickly. It also supports union, intersection, and difference. Use a set to drop duplicates or to remember which ids you have already processed.",
  "Strings: immutability, common operations": "A string is text. In many languages it cannot be changed in place. A 'change' builds a new string. That matters in a loop that glues millions of pieces together, which can become very slow. Prefer a join of a list of pieces.",
  "Git basics: clone, add, commit, push, pull": "Clone copies a repository onto your machine. Add chooses which changes go into the next snapshot. Commit saves that snapshot with a message. Push sends your commits to the remote. Pull brings other people's commits down. Commit small, and write a message that says why.",
  "Branching strategies: main, feature branches": "Main is the line that should always be safe to deploy. A feature branch is a copy of that line where you do one change. You merge it back when it is reviewed. Short branches are easier to review than a branch that lives for a month.",
  "Merge vs Rebase": "Merge joins two lines and keeps a commit that records the join. Rebase moves your commits onto the tip of the other line, which reads more cleanly but rewrites history. Rebase your own unshared branch. Do not rebase commits other people already have.",
  "Resolving conflicts": "A conflict means both sides edited the same lines. Git leaves both versions in the file between markers. You edit it down to the correct result, then mark it resolved and commit. Read both sides. Picking one blindly drops someone's work.",
  "GitHub/GitLab workflows": "You push a branch and open a pull request so someone can review the diff before it reaches main. Checks can run tests automatically. Review comments stay on the lines they refer to. Protect main so nobody pushes to it directly.",
  "Classes and Objects: blueprints and instances": "A class is the blueprint: the fields and methods a thing has. An object is one built instance, with its own values. One User class can produce many user objects. The class defines what is possible. The object holds the actual data.",
  "Encapsulation: private vs public": "Public is the part other code is allowed to use. Private is the internal detail that can change without warning. Hiding the internals lets you fix the inside later without breaking every caller. If everything is public, every caller depends on your accidents.",
  "Inheritance: parent-child relationships": "Inheritance means a child class starts with everything the parent has and adds or replaces some of it. Use it when the child truly is a kind of the parent, such as an image model is a model. Deep chains of inheritance become brittle.",
  "Polymorphism: method overriding and interfaces": "Polymorphism means different classes can be used through the same method name. Overriding replaces a parent method with a more specific one. An interface is a promise of which methods exist, without the code. Callers depend on the promise, not on one concrete class.",
  "Composition vs Inheritance": "Composition means an object holds other objects and delegates work to them. Inheritance means it is a subtype. Prefer composition when you want to mix behaviors, because you can swap one piece without rewriting the family tree. A pipeline that has a model and a logger is composition.",
  "REST API principles: GET, POST, PUT, DELETE": "REST treats URLs as resources. GET reads and should not change anything. POST creates. PUT replaces the whole resource. DELETE removes it. Clients can cache GETs and retry them safely. Do not use GET for an action that charges a card.",
  "HTTP status codes: 2xx, 4xx, 5xx": "2xx means it worked. 4xx means the caller did something wrong, such as a bad body or a missing login. 5xx means your server failed. Pick the code honestly. A 200 that hides an error makes the client, and your monitoring, lie.",
  "JSON data format": "JSON is text that represents objects, lists, strings, and numbers. It is the usual body of a web API because almost every language can read it. It has no dates or comments. Agree on field names and types, and reject bodies that do not match.",
  "API authentication: API keys, OAuth, JWT": "Authentication answers who is calling. An API key is a secret string, simple and easy to leak. OAuth is a login flow that grants limited access, used by 'sign in with Google'. A JWT is a signed token that carries claims such as the user id, so the server can check it without a database lookup.",
  "Rate limiting and throttling": "Rate limiting caps how many requests one caller can make in a window, so one client cannot take down the service or run up the bill. When they pass the cap, return 429. On AWS, API Gateway can enforce this. Tell the client when to retry.",
  "Scalability: horizontal vs vertical scaling": "Vertical scaling makes one machine bigger. It is simple and hits a ceiling. Horizontal scaling adds more machines and needs a way to share work, such as a load balancer and a database that allows it. Design so a second copy of the service is useful, not just possible.",
  "Load balancing strategies": "A load balancer spreads requests across healthy copies of a service and stops sending traffic to a copy that fails its health check. Round robin is even. Least connections favors the idle copy. Sticky sessions pin a user to one copy, which you should avoid if you can keep state elsewhere.",
  "Caching layers: CDN, application, database": "A cache stores a recent answer so you do not recompute it. A CDN caches files near the user. An application cache such as Redis stores computed results. A database can cache hot pages in memory. Cache what is read often and changes rarely, and decide when a cached value is too old.",
  "Microservices vs Monolithic architecture": "A monolith is one deployable program. It is simpler to build and debug at the start. Microservices split the system into separately deployed pieces that talk over the network. Split only when a part needs to scale or ship on its own. A network call can fail in ways a function call cannot.",
  "Message queues and event-driven architecture": "A queue lets one service leave a message and another pick it up later, so a slow consumer does not block the producer. If the consumer crashes, the message stays and can be retried. Event-driven means services react to things that happened, such as 'image uploaded', instead of calling each other directly.",
  "CAP theorem and trade-offs": "During a network split you cannot have perfect consistency and perfect availability at the same time. Consistency means every read sees the latest write. Availability means every request gets a response. Say which one your feature needs. A shopping cart can be slightly stale. A payment should not.",
  "Compute: EC2, Lambda, ECS/EKS, Fargate": "EC2 is a virtual machine you manage. Lambda runs a function for one event and you do not manage a server. ECS runs containers. EKS is managed Kubernetes. Fargate runs containers without you managing the machines underneath. Start with Lambda for short tasks. Use EC2 or Fargate when the work is long or needs a GPU.",
  "Storage: S3, EBS, EFS, Glacier": "S3 stores files as objects and is the default for data, models, and backups. EBS is a disk attached to one EC2 instance. EFS is a shared file system many instances can mount. Glacier is cheap archive storage that is slow to read. Do not put a database on S3. Do not put a million training images on an instance disk.",
  "Networking: VPC, subnets, security groups": "A VPC is your private network inside AWS. Subnets divide it, often into public subnets that can reach the internet and private ones that cannot. A security group is a firewall on a resource. Databases belong in private subnets. Only the load balancer should be reachable from the internet.",
  "Databases: RDS, DynamoDB, Aurora": "RDS runs a managed SQL database such as PostgreSQL or MySQL. Aurora is a faster, cloud-native version of those. DynamoDB is a serverless key-value store with predictable latency at high scale. Use RDS when you need SQL and transactions. Use DynamoDB when you know the exact keys you will query.",
  "IAM: users, roles, policies, least privilege": "IAM decides who can call which AWS action. Users are for people. Roles are for services and are temporary, which is what Lambda should use. A policy lists allowed actions. Least privilege means granting only the actions the job needs, not AdministratorAccess, so a leaked key cannot empty the account.",
  "Cost optimization and billing": "AWS bills by use: hours, requests, storage, and data transferred out. The surprises are idle instances, NAT gateways, and data leaving the region. Tag resources, set a budget alarm, and turn off what you are not using. Say the cost of a design in an interview, not only that it works.",
  "Relational model: tables, rows, columns": "A relational database stores data in tables. A row is one item, such as one user. A column is one fact about that item, such as email. You split facts across tables so each fact lives in one place, then join them when you need a combined view.",
  "Primary keys and foreign keys": "A primary key uniquely identifies a row, such as a user id. A foreign key is a column that points at a primary key in another table, such as an order's user id. The database can refuse a row whose foreign key points at nothing, which keeps references honest.",
  "SQL queries: SELECT, JOIN, WHERE, GROUP BY": "SELECT chooses columns. WHERE filters rows. JOIN combines tables on a key. GROUP BY collapses rows that share a value so you can count or average them. Write the filter before you join huge tables, and do not use SELECT * in production code.",
  "Indexes and query optimization": "An index lets the database find matching rows without reading the whole table. Index columns you filter and join on. Each index costs extra time on writes. Look at the query plan when a query is slow. Guessing is how you add indexes that nothing uses.",
  "ACID properties": "Atomicity means a transaction fully happens or not at all. Consistency means the data still obeys its rules afterward. Isolation means concurrent transactions do not see each other's half-done work. Durability means a committed write survives a crash. SQL databases give you this. Many NoSQL stores do not.",
  "Transactions and locks": "A transaction groups several writes so they succeed or fail together, such as debiting one account and crediting another. A lock stops two transactions from changing the same row at once. Locks held too long make other queries wait, so keep transactions short.",
  "Document stores: MongoDB, DocumentDB": "A document store keeps one record as a JSON-like document, so different records can have different fields. MongoDB is the common one. DocumentDB is the AWS-compatible managed version. Use it when the shape varies and you mostly fetch a whole document by id. It is a weak fit for complex joins.",
  "Key-value stores: DynamoDB, Redis": "A key-value store fetches a value by an exact key and does little else, which is why it is fast. DynamoDB is durable and scales on AWS. Redis is in-memory and is usually a cache, not the only copy of the data. Design the key around the query you will actually run.",
  "Graph databases: Neo4j, Neptune": "A graph database stores things and the relationships between them as first-class links, so questions like 'friends of friends' stay fast. Neo4j is the common product. Neptune is the AWS one. Use it for highly connected data. Do not use it as a general replacement for SQL.",
  "CAP theorem in NoSQL": "NoSQL systems often choose to stay available during a network split and reconcile copies later, instead of refusing writes. That is a product decision, not a free lunch. Know which behavior your database picked before you store anything that must be exactly right immediately.",
  "Eventual consistency vs strong consistency": "Strong consistency means a read after a write sees that write. Eventual consistency means it will, but a read in between might see the old value. A like counter can be eventual. A seat reservation should be strong. DynamoDB lets you request a strongly consistent read when you need it.",
  "NumPy arrays and vectorization": "A NumPy array stores numbers in a compact block and runs math on the whole block in compiled code. A Python loop over a million numbers is much slower. Vectorize means writing the operation on the array, not on each item. This is the default way to do numeric work in Python.",
  "DataFrames and Series in Pandas": "A Series is one labeled column. A DataFrame is a table of columns. Pandas is how you load a CSV, look at it, and reshape it before modeling. It is excellent up to what fits in memory. Past that, use chunks, a database, or Spark.",
  "Data cleaning: handling missing values": "Missing values are empty cells. Decide whether they are random, or whether 'missing' itself is information. You can drop the row, fill with a median, or add a flag. Filling everything with zero often invents a fact that was not there.",
  "Filtering, sorting, grouping": "Filtering keeps rows that match a condition. Sorting orders them. Grouping splits rows by a key, such as country, so you can compute a statistic per group. Do these with Pandas operations, not by looping row by row.",
  "Merging and joining datasets": "A merge combines two tables using a shared key, the same idea as a SQL join. An inner merge keeps only matches. A left merge keeps every row from the left table. Check the row count afterward. A merge that multiplies rows usually means the key was not unique.",
  "Aggregation and pivot tables": "Aggregation collapses many rows into a summary, such as the sum of sales per month. A pivot table turns unique values of one column into new columns, which is how you make a cross-tab. These are for understanding the data, and sometimes for features.",
  "Descriptive statistics: mean, median, mode": "The mean is the average and is pulled by extreme values. The median is the middle value and resists extremes. The mode is the most common value. For income or latency, the median often describes a typical case better than the mean.",
  "Probability distributions": "A distribution describes how likely different values are. A normal distribution is the familiar bell curve. Real data is often skewed, with a long tail of large values. Look at a histogram before you assume a bell curve. Many model assumptions depend on this shape.",
  "Hypothesis testing basics": "You start with a default claim, such as 'the new model is no better', and ask whether the data is surprising under that claim. A small p-value means the result would be rare if the claim were true. It does not tell you the size of the improvement. Report the difference, not only the p-value.",
  "Correlation vs causation": "Correlation means two measurements move together. Causation means one produces the other. Models exploit correlation to predict. You need a reason, or an experiment, before you tell someone to change the cause. Ice cream does not cause sunburn.",
  "Outlier detection": "An outlier is a value far from the rest. It can be a broken sensor, a typo, or the fraud you are paid to find. Plot it and ask which. Deleting outliers by habit throws away the interesting rows. Some models, such as linear regression, are pulled hard by them.",
  "Linear Regression": "Linear regression predicts a number as a weighted sum of the inputs, plus a constant. The weights are the model. It is fast, easy to explain, and the right first try when the relationship is roughly straight. It fails when the real pattern curves or when inputs interact strongly.",
  "Logistic Regression": "Logistic regression predicts a probability of a class, usually yes or no, even though the name says regression. The output is between 0 and 1. It is a strong, explainable baseline for classification. Start here before a neural network.",
  "Decision Trees and Random Forests": "A decision tree asks a sequence of yes or no questions about the features. One tree is easy to read and easy to overfit. A random forest averages many trees trained on different slices, which is more accurate and harder to explain. Use a forest when a single tree memorizes the training set.",
  "Gradient Boosting: XGBoost, LightGBM": "Boosting builds trees one after another, each one trying to fix the errors of the previous ones. XGBoost and LightGBM are the standard libraries. They win a lot of contests on tables of rows and columns. They need care with learning rate and tree depth or they overfit.",
  "Model evaluation: accuracy, precision, recall, F1": "Accuracy is how often you are right, and it lies when one class is rare. Precision is how many of your alarms were real. Recall is how many of the real cases you caught. F1 combines precision and recall. Pick the metric that matches the cost of the mistake.",
  "K-Means clustering": "K-Means places K centers and assigns each point to the nearest center, then moves the centers and repeats. You choose K. It wants blobs of similar size and is confused by odd shapes and outliers. Scale the features first, or one column with large numbers dominates.",
  "Hierarchical clustering": "Hierarchical clustering builds a tree of groups, merging the closest clusters step by step. You can cut the tree to get any number of groups afterward. It is easier to explore than K-Means and much slower on large data. Use it when you want to see how groups nest.",
  "PCA: dimensionality reduction": "PCA compresses many numeric columns into fewer new columns that keep as much variation as possible. Use it to plot high-dimensional data or to speed up a later model. Scale the columns first. The new columns are mixtures, so they are harder to explain to a person.",
  "Anomaly detection": "Anomaly detection flags points that do not look like the rest, without needing labeled examples of the rare event. It is used for fraud, broken sensors, and intrusions. You must decide a threshold. Too sensitive and you drown in false alarms. Too strict and you miss the event.",
  "Activation functions: ReLU, sigmoid, tanh": "An activation is a small function applied after each layer so the network can learn curves, not only straight lines. ReLU outputs zero for negative inputs and is the default in hidden layers. Sigmoid squashes a number into 0 to 1 and is used for a single probability. Tanh squashes into -1 to 1.",
  "Backpropagation": "Backpropagation computes how much each weight contributed to the error, starting at the output and moving backward through the layers. Those numbers, the gradients, tell training which way to nudge each weight. Without it you would be guessing millions of numbers.",
  "Gradient descent and optimization": "Gradient descent changes the weights a small step in the direction that reduces the error. The learning rate is the size of the step. Optimizers such as Adam adapt that step per weight. Too large a step diverges. Too small a step wastes time and money.",
  "Loss functions": "The loss is the number that says how wrong the prediction is. Mean squared error is common for predicting a number. Cross-entropy is common for classification. Training minimizes the loss. If you pick a loss that does not match the decision you care about, you will optimize the wrong thing.",
  "Regularization: L1, L2, dropout": "Regularization penalizes a model for being too flexible, so it generalizes instead of memorizing. L2 shrinks weights. L1 can push some weights to exactly zero, which drops features. Dropout randomly ignores neurons during training so the network does not rely on one path. Use them when training accuracy is high and validation accuracy is not.",
  "Convolutional Neural Networks for images": "A CNN slides small filters across an image to detect local patterns such as edges, then combines them into shapes and objects. Sharing one filter across the whole image is what makes it practical. This is the standard architecture for photos. You almost always start from a pretrained CNN.",
  "Transfer learning with pre-trained models": "Transfer learning takes a model trained on a huge public dataset and continues training it on your smaller set. The early layers already see edges and textures. You mainly teach the last layers your labels. It needs less data, less time, and less money than training from random weights.",
  "LSTMs for sequences": "An LSTM is a recurrent network with gates that decide what to remember and what to forget as it reads a sequence one step at a time. It was the standard for text and time series before Transformers. It still appears in older systems and in some signal work. It is slow because the steps cannot run in parallel.",
  "Transformers architecture": "A Transformer uses attention so every token can look at every other token, instead of reading strictly left to right. That trains well on GPUs and handles long context. GPT, Claude, and BERT are Transformers. This is the architecture you should know for modern language and many vision models.",
  "Image representation: pixels, channels": "An image is a grid of pixels. A grayscale pixel is one number. A color pixel is usually three numbers, red, green, and blue, called channels. A 224 by 224 color image is 224 × 224 × 3 numbers. Models expect a fixed size and a fixed channel order, so you resize and reorder before inference.",
  "Filtering, edge detection": "A filter slides a small grid of weights over the image to blur, sharpen, or find edges. An edge is a sharp change in brightness and often outlines an object. Classic filters do this with fixed weights. The first layers of a CNN learn similar filters from data.",
  "Color space conversions": "RGB is how screens store color. Other spaces, such as HSV, separate hue from brightness, which can make a task easier. Grayscale throws color away. Convert only when the task needs it, and remember that a model trained on RGB will be wrong if you feed it another order.",
  "Image transformations": "Transformations are resize, crop, rotate, flip, and changes to brightness. You use them to match the model's expected input, and as augmentation so the model does not memorize one angle of each object. Keep a copy of the original. A bad resize can destroy the thing you wanted to detect.",
  "Image classification": "Classification assigns the whole image one label, such as 'cat' or 'invoice'. It does not say where the object is. It is the simplest vision task and a good baseline. If you need a location, you need detection or segmentation instead.",
  "Object detection: YOLO, R-CNN": "Detection finds each object and draws a box, with a class on the box. The R-CNN family proposes regions and then classifies them. YOLO does both in one pass, which is why it is used when you need speed. You measure it with how well the boxes overlap the true boxes, not only whether the class is right.",
  "Semantic segmentation": "Segmentation labels every pixel, for example road, car, or sky. Semantic segmentation does not separate two cars from each other. Instance segmentation does. Use it when the shape matters, such as medical images or removing a background. It needs pixel-level labels, which are expensive to create.",
  "OCR (Optical Character Recognition)": "OCR reads text out of an image. It fails on blur, handwriting, glare, and unusual fonts. The photo quality matters as much as the model. On AWS, try Textract for documents before you train a model. Always check the output on your real scans, not on a clean sample.",
  "Tokenization": "Tokenization splits text into pieces a model can turn into numbers. Those pieces may be words or subwords. 'Unbelievable' might become several tokens. The tokenizer used in training must be the same one used later, or the numbers mean something else. Tokens are also how API bills are counted.",
  "Stop word removal, stemming/lemmatization": "Stop words are common words such as 'the' and 'of' that older models ignored. Stemming chops a word to a crude root. Lemmatization maps it to a real dictionary form, so 'better' becomes 'good'. Modern language models usually do not want you to do this. You still do it for simple search and classic models.",
  "TF-IDF": "TF-IDF scores a word high when it appears often in this document and rarely in the whole collection. It is a cheap, strong baseline for search and classification. It does not know that two different words can mean the same thing. Use it before you reach for a large model.",
  "Word embeddings: Word2Vec, GloVe": "An embedding turns a word into a list of numbers so that similar words land near each other. Word2Vec and GloVe are older methods that learn one vector per word. Current models build a vector from context instead, so the same word can differ by sentence. Embeddings are what vector search compares.",
  "Sentiment analysis": "Sentiment analysis labels text as positive, negative, or neutral, sometimes with a score. It works on clear language and fails on sarcasm, mixed opinions, and jargon it was not trained on. For a known domain, a small model or Amazon Comprehend may be enough. Always test on your own messages.",
  "Named Entity Recognition (NER)": "NER finds spans such as people, companies, dates, and amounts inside text. The output is the span and its type, not a summary. It is how you pull structured fields out of an email or a contract. Errors here flow into whatever database you write next, so measure it on real documents.",
  "Text classification": "Text classification assigns a whole document one or more labels, such as a support ticket's category. You can do it with TF-IDF and a simple model, or with a language model. Start simple if the labels are obvious from keywords. Use a larger model when the meaning depends on phrasing.",
  "Transformers: BERT, GPT": "BERT reads the whole sentence in both directions and is strong at understanding and classification. GPT predicts the next token and is strong at generating text. You fine-tune BERT-style models for labels. You prompt GPT-style models to write or extract. They are different tools, not two versions of the same thing.",
  "Attention mechanisms": "Attention lets each token weigh the other tokens when deciding its meaning. That is how a model links 'it' to the right noun, and how a Transformer uses context. In interviews, describe it as a weighted lookup over the other positions, not as the model 'paying attention' in a human sense.",
  "LLMs: GPT, Claude, Llama": "These are large language models you usually call through an API. GPT is OpenAI's. Claude is Anthropic's. Llama is Meta's and can be self-hosted. On AWS, Bedrock gives you several of them without you running the GPUs. They generate text. They do not automatically know your private documents.",
  "Pre-training vs fine-tuning vs prompting": "Pre-training is the expensive general education of the model, already done by the provider. Prompting is how you ask it, including examples in the request. Fine-tuning continues training on your examples to change style or format. Prompt and retrieve first. Fine-tune when that is not reliable. Fine-tuning is a poor way to add new facts.",
  "Transformer architecture": "The model stacks layers of attention and feed-forward networks. Attention mixes information across the prompt. The feed-forward part processes each position. More layers and a wider model mean more capability and more cost. You do not need to derive the math to use one, but you should know why context length and tokens matter.",
  "Model sizes and compute requirements": "Size is measured in parameters, the learned numbers. Larger models are more capable and need more memory and more GPUs. A 7-billion-parameter model can run on one serious GPU. The frontier models need a cluster. If you do not need to host it, call an API and let the provider own the cluster.",
  "Inference costs": "You pay for inference on every request, usually by tokens in plus tokens out. A long prompt, a long answer, and a large model all cost more. Caching repeated questions, shorter prompts, and a smaller model for easy cases are the levers. Training is a one-time bill. Inference is the bill that grows with users.",
  "Zero-shot, few-shot prompting": "Zero-shot is an instruction with no examples. Few-shot puts a handful of input and output examples in the prompt so the model copies the pattern. Use few-shot when the format is easier to show than to describe. The examples count as tokens, so they cost money on every call.",
  "Chain-of-thought reasoning": "Chain-of-thought asks the model to write the steps before the final answer. That improves multi-step problems such as math and logic, because the model can use its own intermediate text. Put the final answer on its own line so your code can parse it. The steps are not a guarantee of correctness.",
  "Prompt templates": "A template is a prompt with blanks you fill in, such as the user question and the retrieved documents. Keep the instructions stable and the variable part clearly marked. Version the template the way you version code. A small wording change can change the answers, so test it on a fixed set.",
  "Temperature and sampling": "Temperature controls randomness. Near 0, the model repeats the most likely wording, which you want for extraction and facts. Higher values vary the wording, which you want for brainstorming. Sampling settings such as top-p cut off unlikely tokens. Set them on purpose. Do not leave a creative temperature on a factual task.",
  "Prompt injection and safety": "Prompt injection is untrusted text that says 'ignore your instructions' and tries to override you. It shows up in user messages and in documents you retrieve. Treat retrieved text as data, not as commands. Limit which tools the model can call. Do not put secrets in the prompt.",
  "Retrieval-Augmented Generation": "RAG searches your documents, inserts the relevant passages into the prompt, and asks the model to answer from those passages. Use it when the facts live in your files and change often. If the search returns the wrong passage, the answer will be wrong or invented. The search is the part to debug first.",
  "Vector databases": "A vector database stores embeddings and returns the nearest ones to a query. That is search by meaning rather than exact keywords. Pinecone, OpenSearch, and pgvector are examples. You still need sensible chunks. A database cannot fix a chunk that mixed three unrelated topics.",
  "LangChain framework": "LangChain is a library of pieces for prompts, retrievers, tools, and chains. It saves glue code. It also hides the steps, which makes debugging harder when you do not know which step failed. Use it when it helps. Read the actual prompt it sends when a result looks wrong.",
  "LLM agents with tools": "An agent lets the model decide to call a function, such as search or a database query, then read the result and continue. Your code runs the function. The model only chooses it. Use an agent when the path depends on what it finds. Prefer a fixed pipeline when the steps are always the same.",
  "Memory and context management": "The model only sees what is in the current prompt, up to a context limit. Memory is your system saving earlier turns or facts and putting them back into later prompts. Put the relevant part in, not the entire history. Long contexts cost more and can distract the model.",
  "REST API testing": "An API test sends a request and checks the status code, the body, and any side effect such as a row written to a database. Cover success, bad input, and a missing login. Run these before every deploy. A test that only checks for a 200 misses a wrong JSON body.",
  "Integration testing": "An integration test checks that your service works with the real neighbors, or a close copy: the database, the queue, the other API. Unit tests fake those neighbors. You want both. Integration tests are fewer and slower, and they catch the mismatches unit tests cannot see.",
  "Load testing": "Load testing sends production-like traffic to see when latency and errors climb. You learn the breaking point before your users do. On AWS, watch CPU, memory, and database connections during the test. A system that is fast for one user can fall over at one hundred.",
  "API monitoring": "Monitoring watches the live API: request rate, error rate, and latency. An alarm fires when a number crosses a line you set, such as errors above one percent. CloudWatch does this on AWS. Without it you learn about outages from customers.",
  "CI/CD pipelines": "CI runs tests on every change. CD deploys the change that passed. On AWS, CodePipeline and CodeBuild are the managed tools. A pipeline that can deploy should also be able to stop and roll back. Do not deploy from a laptop as the normal path.",
  "CloudFormation, Terraform": "Both tools create and update AWS resources from a file. CloudFormation is native to AWS. Terraform works across clouds and stores a state file of what it created. Pick one and do not also click resources into existence. Review the plan before you apply it.",
  "Automated deployments": "A deployment should be a command or a pipeline, with the same steps every time: build, test, publish the image, shift traffic. Manual steps get skipped under pressure. Automate the happy path and the rollback.",
  "Blue-green deployments": "You run two copies of the environment. Traffic goes to blue. You deploy to green, test it, then switch traffic. If green is bad, you switch back. You pay for both copies during the switch. The gain is a rollback that does not require another deploy.",
  "Monitoring automation": "Automation should page a person only when a human must act, and it should include the dashboard link and the last deploy. Alerts that fire all day get ignored. Tune them. Auto-remediate the boring cases, such as restarting a stuck task, and record that it happened.",
  "LangChain agents: ReAct pattern": "ReAct means the model alternates a written reason with an action, then reads the observation. The reason is text. The action is a tool call. It helps you see why the agent chose a tool. It also spends tokens on that reasoning. Cap the number of steps so a confused agent cannot loop all day.",
  "Tool use and function calling": "You describe each tool's name, purpose, and arguments. The model returns a structured request. Your runtime executes it and returns the result. Validate the arguments before you run anything that writes or deletes. The model will sometimes call the wrong tool with confident arguments.",
  "Agent memory": "Short-term memory is the current conversation in the prompt. Long-term memory is a store, often a vector database, of facts you choose to keep. Write down what is stored and for how long. Unbounded memory becomes a privacy problem and a messy prompt.",
  "Multi-agent systems": "Several agents split a job, for example one researches and one writes, and pass messages. Use this when one agent with a few tools is genuinely not enough. Every extra agent adds latency, cost, and a new place for a wrong handoff.",
  "Safety and guardrails": "Guardrails limit what the agent can do: which tools, how many steps, how much money, and which topics to refuse. Check outputs for unsafe content before they reach a user. On Bedrock you can add guardrail policies. A demo without limits is not a design.",
  "Monitoring: metrics, logs, traces": "Metrics are numbers over time, such as error rate and latency. Logs are the lines that explain one request. Traces follow one request across services. You need all three. CloudWatch holds metrics and logs. X-Ray does traces. A dashboard nobody looks at is not monitoring.",
  "Error handling and graceful degradation": "When a dependency fails, fail clearly or serve a reduced answer, such as search without personalization. Do not hang until the client times out. Retry only errors that are likely temporary, with a pause that grows, and do not retry a bad request.",
  "Scaling strategies": "Scale the part that is actually full. Add copies of a stateless API behind a load balancer. Add read replicas for a database that is busy reading. Put a queue in front of slow work. Measure before you buy a bigger machine.",
  "Security: auth, secrets, encryption": "Authenticate every caller. Authorize the specific action. Keep secrets in a manager such as AWS Secrets Manager, not in code or a container image. Encrypt data on disk and on the wire. Least privilege on the IAM role matters as much as the application password.",
  "Disaster recovery": "Decide how much data you can lose and how long you can be down. Backups that you have never restored do not count. For a serious system, copy data to another Availability Zone or Region. Write the restore steps and run them.",
  "Cost optimization": "Look at the bill by service. The usual waste is idle compute, oversized instances, and data transfer. Use Savings Plans or Spot where the workload allows. Set an alarm before the bill, not after. A design that is correct and unaffordable is not done.",
  "Incident response": "When production breaks, stop the bleeding first: roll back, failover, or shed traffic. Then find the cause. Tell the people who are affected. Afterward, write what happened, how you noticed, and what you will change. Blame is not a step.",
  "Resume optimization": "Lead with projects and results, not a list of tools. One line should say what you built, the stack, and the effect, such as latency or cost. A recruiter scans. Put the AWS and model work near the top. A certificate with no project is weaker than a project with no certificate.",
  "LinkedIn for AI/ML roles": "Use the headline for the role you want and the skills you can defend. The featured section should link to a project with a README and a running demo if you have one. Recruiters search for words like SageMaker, Bedrock, Python, and the job title. Write those words only if you can talk about them.",
  "Interview preparation": "Practice out loud. For each project, be ready for what it does, why you chose the pieces, what broke, and what it cost. Review the concepts on this roadmap until you can explain them without reading. A silent correct answer does not help you in the room.",
  "System design interviews": "Clarify the scale and the requirement first. Draw the boxes: client, API, model or database, queue, cache. Say how it fails and what it costs. They are grading the trade-offs you name, not a single perfect diagram. Leave a box you can go deeper on if they ask.",
  "Behavioral interviews: STAR method": "STAR is Situation, Task, Action, Result. Pick a real story. Spend the time on what you did and how you know it worked. 'We improved the model' is not a result. 'The false positive rate fell from 12% to 4% and we shipped it' is.",
  "Portfolio projects": "Two finished projects beat six tutorials. Each one needs a README, a way to run it, and a short note on the design. Deploy one on AWS so you can talk about IAM, logs, and cost. Make the data and the evaluation visible. A notebook with no conclusion is not a project.",
  "AWS certifications": "The Solutions Architect Associate is the useful general certificate. The Machine Learning Specialty is relevant if the role is model-heavy. They help you pass a screen and they force you to learn the services. They do not replace a deployed project or the ability to explain a trade-off."

  "System Design": {
    "example": "Design a service that classifies support tickets, 50 requests per second average, 400 at peak, answers under 300 ms, and must not lose a ticket if the model is down. Start with numbers: 400 requests per second is not 'Google scale', but it is enough that one small server may be the wrong bet. Put API Gateway or a load balancer in front of several stateless workers. The model is loaded in each worker, not fetched per request. Tickets that can wait go to SQS so a model restart does not drop them. Hot identical texts, such as a status-page blast, are cached in Redis for 60 seconds. The source of truth for the ticket is a database, not the cache. Say the trade-off: the cache can be stale for a minute, which is fine for a category label and wrong for a bank balance. Cost: workers dominate if the model is large. A 2 GB model on four instances is a standing bill. A tiny keyword model plus a hosted LLM only for the hard 10 percent is often cheaper. Draw this as five boxes and be ready to double-click any box.",

  "Cloud Platforms (AWS Focus)": {
    "example": "You need to run a text classifier. Three real options. Lambda: the package is under the size limit, each call finishes in under a second, traffic is spiky. You pay per millisecond and scale to zero. Fargate: you already have a Docker image with heavy libraries, calls take 2 seconds, you want a steady service. EC2 with a GPU: you are training, or the model does not fit the Lambda memory ceiling. Storage of the training file is S3, not the instance disk, so a dead instance does not take the data with it. The function's IAM role can read that bucket and nothing else. A security group lets the database receive traffic only from the service, not from the internet. Bill check: a NAT gateway left in an unused VPC is a classic 30-dollar-a-month surprise. Tag the resources Project=ticket-classifier so Cost Explorer can show this one idea. In an interview, this comparison is the answer they want, not a definition of EC2.",

  "SQL Databases": {

  "NoSQL Databases": {
    "example": "A classification service looks up a user by id on every request and writes a prediction record keyed by prediction id. Those are two key-value access patterns. DynamoDB fits: partition key user_id for the profile, and a second table with prediction_id. You do not query 'all predictions that mention the word refund' in DynamoDB. That is a different pattern, and forcing it with a scan gets slow and expensive as the table grows. If the product later needs ad hoc filters for an analyst, send a copy to a SQL warehouse or OpenSearch. Eventual consistency is fine for the profile photo URL. It is not fine for 'has this prediction id already been written' if a retry would double-charge. Use a condition write: put the item only if the key does not exist. Redis in front of DynamoDB is for the profile you read 1,000 times a second, with a TTL of a minute, and DynamoDB remains the source of truth.",

  "NumPy & Pandas": {
    "example": "You have a CSV of 200,000 support tickets: created_at, channel, minutes_to_resolve, topic. A Python loop that computes the mean minutes per topic takes seconds and is easy to get wrong. Pandas: read_csv, drop rows where minutes_to_resolve is missing or negative, groupby topic, and mean. That is one expression and it is vectorized. Before modeling, print shape, dtypes, and the fraction missing per column. A column that looks numeric but loaded as text because of one 'n/a' will silently break a model later. If you merge this file with a user table, check the row count before and after. If 200,000 tickets become 2 million, the user id was not unique and you multiplied rows. Fix the key. Do not train on the duplicated table.",

  "Statistics": {
    "example": "A model flags 4 percent of tickets as urgent. The mean time-to-resolve is 40 hours and the median is 6 hours. The mean is being dragged by a long tail. If you tell the team 'typical tickets take 40 hours,' you are wrong. Typical is closer to 6. The 4 percent urgent rate and a 4 percent bug rate in the logger might be correlated because both happen on Mondays after a deploy, not because urgency causes bugs. Do not propose 'make the model less urgent' as a fix for bugs. For a claim that a new prompt is better, do not stare at three examples. Take 200 held-out tickets, score both prompts, and report the difference in accuracy with the size of the set. A 2 point gain on 30 tickets is noise. The same 2 points on 2,000 tickets is a conversation. Outliers: one ticket with minutes_to_resolve of 100,000 is a unit bug, not a heroic case. Plot it before you delete it.",

    "example": "Predict whether a ticket is billing. Features: length, channel, and whether the word invoice appears. Split 70 percent train, 15 percent validation, 15 percent test, stratified so each split has the same fraction of billing tickets. Fit logistic regression first. On validation you get precision 0.80 and recall 0.55. The business says a missed billing ticket is worse than an extra tag, so you lower the threshold until recall is 0.80 and you accept precision 0.62. You write that trade down. Only then do you try a random forest. If it gains 1 point and is harder to explain, you keep logistic regression. The test set is used once, at the end. If you tune on it, the number you tell the company is fiction. A concrete leak: including 'resolved_as_billing' as a feature. That field does not exist when the ticket arrives. The model looks brilliant and is useless online.",

  "Neural Networks": {
    "example": "A one-hidden-layer network for ticket classification. Input is a bag of 1,000 word counts. Hidden layer 32 units with ReLU. Output is 3 classes with softmax, trained with cross-entropy. If you used no activation, stacking layers would still be a linear model and would not beat logistic regression. Training: mini-batches of 64, Adam, learning rate 0.001. You watch two curves. Training loss falls. Validation loss falls, then rises after epoch 8. That rise is overfitting. You stop at epoch 8, or you add dropout of 0.2 and try again. A learning rate of 0.1 makes the loss NaN by step 20. That is a diverging step size, not a mystery. Cut it by 10. L2 regularization of a small weight decay is the knob if weights grow huge and validation stays worse than training. You do not need a deep network for this bag of words. The exercise is to see the curves and know what they mean.",

  "CNNs & RNNs": {
    "example": "You need to tell invoices from selfies. You do not train a CNN from random weights on 400 photos. You take a small pretrained model, freeze the early layers, and train a new final layer on your labels. Images are resized to the size that model expects, such as 224 pixels, and normalized with the same mean and standard deviation the original training used. If you skip that normalization, accuracy collapses and the architecture is not the reason. Augment with flips only if a flipped invoice is still a valid invoice. A flipped selfie may be fine. A flipped photo of text is a different problem. For a sequence, such as the last 20 daily ticket counts, an LSTM can forecast the next day. In 2026, if the sequence is text, you use a Transformer through an API rather than training an LSTM unless you have a reason, such as a tiny model on a device. Say that reason.",

  "Image Processing": {
    "example": "A photo of a receipt arrives as 4032 by 3024 JPEG, about 3 MB. The classifier wants 224 by 224 RGB. You decode the JPEG to a pixel array, resize with an interpolation that does not turn text into mush more than necessary, and scale pixels from 0-255 to the range the model saw in training, often 0-1 or a mean-subtracted float. Channel order matters: some libraries are RGB, some are BGR. Swap them and every color is wrong while the code 'works.' Edge detection is the classic picture of a filter. A Sobel filter highlights where brightness jumps, which on a receipt is the outline of glyphs. You would not ship Sobel as an OCR system, but you should be able to say that a convolution is this same idea with learned weights. Keep the original file in S3. Store the resized tensor only as a cache. If the preprocessing code changes, you can rebuild the cache. If you overwrote the originals, you cannot.",

  "Object Detection": {
    "example": "Classification says the photo 'contains a forklift.' Detection says there is a forklift in a box from pixel (120, 40) to (400, 300) with confidence 0.87, and a person in another box. You need detection when the location changes the action, such as counting items or refusing to proceed if a person is in the aisle. A YOLO-style model does this in one forward pass, which is why factories use it on a camera stream. Intersection over Union measures whether your box matches the true box. A correct class with a box on the wrong half of the image is a miss. Segmentation is the next step when you need the outline, not the rectangle, and it costs more to label. For invoices and IDs, OCR is the actual product, and a managed service such as Textract is the right first experiment. Spend a day on Textract quality on your real scans before you propose training a detector.",

  "Text Processing": {
    "example": "The sentence 'I cannot log in to the billing portal' becomes tokens before any model sees it. A naive split on spaces produces 'in' and 'to' as if they matter. A subword tokenizer might keep 'billing' whole and split a rarer word. For a classic baseline you lowercase, remove stopwords, and vectorize with TF-IDF, then classify with logistic regression. That baseline often beats a rushed neural net on a few thousand tickets. Embeddings are the next step when 'invoice' and 'bill' should match. You embed each ticket and nearest-neighbor search finds similar past tickets. Do not stem text before you send it to a modern LLM. You would be deleting the cues it was trained on. Do stem or lemmatize only inside the classic TF-IDF pipeline, and be consistent at training and at inference. A tokenizer mismatch is a silent production bug: the same word becomes a different id and the model reads noise.",

  "NLP Models": {
    "example": "A ticket router needs a category, not a poem. That is classification. BERT-style models are a natural fine-tune if you have a few thousand labels and must run cheaply. A GPT-style model is a natural prompt if you have 50 labels and can pay per call. Sentiment on app reviews is a classification head on top of an encoder, or a one-line prompt. NER is what you want when finance asks 'pull the dollar amounts and the dates,' because you need spans, not a vibe. Attention is the mechanism inside both: each token builds its representation by a weighted look at the others, which is why 'it' can attach to 'portal' rather than to 'I.' Measure with a confusion matrix. If billing and access are constantly swapped, the label guide is ambiguous or the text really is both. Fix the label definition before you buy a larger model.",

        function esc(s) {
            return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
        }

        function watchHtml(title) {
            const list = videos[title];
            if (!list) return "";
            const items = list.map(v => `
                <div class="watch-item">
                    <a href="${esc(v.url)}" target="_blank" rel="noopener noreferrer">${esc(v.title)}</a>
                    <p class="meta">${esc(v.channel)}</p>
                    <p class="why">${esc(v.why)}</p>
                </div>`).join("");
            return `<div class="lesson watch"><h4 class="section-title">Watch</h4>${items}</div>`;
        }

        function lessonHtml(title) {
            const L = lessons[title];
            if (!L) return "";
            const steps = L.steps.map(step => `<li>${step}</li>`).join("");
            return `
                ${watchHtml(title)}
                <div class="lesson example">
                    <h4 class="section-title">Worked example</h4>
                    <p>${L.example}</p>
                </div>
                <div class="lesson practice">
                    <h4 class="section-title">Practice, then the resolution</h4>
                    <p>${L.practice}</p>
                </div>
                <div class="lesson project">
                    <h4 class="section-title">Project · ${L.project}</h4>
                    <p class="meta">${L.time}</p>
                    <ol>${steps}</ol>
                    <p><span class="q">Done when</span> ${L.done}</p>
                </div>`;
        }

        function renderRoadmap() {
            const container = document.getElementById('roadmap-content');
            container.innerHTML = roadmapData.map(level => `
                <article class="level-card">
                    <div class="level-header">
                        <div class="level-num">${String(level.level).padStart(2, "0")}</div>
                        <div>
                            <h2 class="level-title color-${level.color}">${level.title}</h2>
                            <p class="level-desc">${level.description}</p>
                            ${level.awsRelevance ? `<div class="badge">${level.awsRelevance}</div>` : ''}
                        </div>
                    </div>
                    ${level.topics.map((topic, idx) => `
                        <div class="topic" id="level${level.level}-topic${idx}">
                            <div class="topic-title" onclick="toggleTopic('level${level.level}-topic${idx}')">
                                ${topic.title}
                                <span class="arrow" aria-hidden="true"></span>
                            </div>
                            <div class="topic-content">
                                <p class="explain">${(explanations[topic.title] && explanations[topic.title].summary) || ""}</p>
                                <div class="section">
                                    <h4 class="section-title">📚 Key Concepts</h4>
                                    <ul>
                                        ${topic.concepts.map(c => `<li><span class="q">${c}</span><p class="answer">${conceptNotes[c] || ""}</p></li>`).join('')}
                                    </ul>
                                </div>
                                ${lessonHtml(topic.title)}
                                <div class="section">
                                    <h4 class="section-title interview">❓ Interview Questions</h4>
                                    <ul>
                                        ${topic.questions.map((q, qi) => `<li class="interview-q"><span class="q">${q}</span><p class="answer">${(explanations[topic.title] && explanations[topic.title].answers[qi]) || ""}</p></li>`).join('')}
                                    </ul>
                                </div>
                                <div class="section">
                                    <h4 class="section-title tips">💡 Practical Tips</h4>
                                    <ul>
                                        ${topic.tips.map(t => `<li class="tip">${t}</li>`).join('')}
                                    </ul>
                                </div>
                                ${topic.aws ? `
                                    <div class="aws-box">
                                        <h4 class="section-title aws">☁️ AWS Services</h4>
                                        <ul>
                                            ${topic.aws.map(a => `<li class="aws-item">${a}</li>`).join('')}
                                        </ul>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `).join('')}
                </article>
            `).join('');
        }
        
        function renderAWS() {
            const container = document.getElementById('aws-content');
            container.innerHTML = `
                <div class="level-card">
                    <h2 class="level-title">☁️ AWS AI/ML Engineer Focus</h2>
                    <p class="level-desc">Essential AWS services and concepts for AI/ML engineering roles</p>
                    
                    <div class="stack">
                        <h3 class="group-title">Core AI/ML Services</h3>
                        
                        <div class="service-card">
                            <h4 class="service-name">Amazon SageMaker</h4>
                            <p class="service-purpose">End-to-end ML platform</p>
                            <ul>
                                <li>Built-in algorithms and frameworks (TensorFlow, PyTorch)</li>
                                <li>Training jobs with distributed computing</li>
                                <li>Model endpoints with auto-scaling</li>
                                <li>Model Monitor for drift detection</li>
                                <li>Feature Store for ML features</li>
                            </ul>
                            <div class="when">
                                <strong>When to use:</strong> Custom ML models, training at scale, MLOps
                            </div>
                        </div>
                        
                        <div class="service-card">
                            <h4 class="service-name">Amazon Bedrock</h4>
                            <p class="service-purpose">Access foundation models via API</p>
                            <ul>
                                <li>Models: Claude (Anthropic), Llama 3, Amazon Titan, Cohere</li>
                                <li>Knowledge Bases: managed RAG implementation</li>
                                <li>Agents: build LLM-powered agents with tool use</li>
                                <li>Guardrails for content filtering and safety</li>
                                <li>Private and secure - data not used for training</li>
                            </ul>
                            <div class="when">
                                <strong>When to use:</strong> LLM applications, chatbots, RAG, generative AI
                            </div>
                        </div>
                        
                        <div class="service-card">
                            <h4 class="service-name">AWS Lambda</h4>
                            <p class="service-purpose">Serverless compute</p>
                            <ul>
                                <li>Run code without managing servers</li>
                                <li>Auto-scaling and high availability</li>
                                <li>Pay only for compute time used</li>
                                <li>Integrates with 200+ AWS services</li>
                            </ul>
                            <div class="when">
                                <strong>When to use:</strong> API backends, ML inference, event-driven processing
                            </div>
                        </div>
                        
                        <h3 class="group-title">Pre-built AI Services</h3>
                        
                        <div class="service-card">
                            <h4 class="service-name">Amazon Rekognition</h4>
                            <p class="service-purpose">Computer vision</p>
                            <ul>
                                <li>Face detection and recognition</li>
                                <li>Object and scene detection</li>
                                <li>Content moderation</li>
                                <li>Text in images (OCR)</li>
                            </ul>
                        </div>
                        
                        <div class="service-card">
                            <h4 class="service-name">Amazon Comprehend</h4>
                            <p class="service-purpose">Natural language processing</p>
                            <ul>
                                <li>Sentiment analysis</li>
                                <li>Entity recognition</li>
                                <li>Key phrase extraction</li>
                                <li>Language detection</li>
                            </ul>
                        </div>
                        
                        <h3 class="group-title">🎯 Interview Topics for AWS Roles</h3>
                        
                        <div class="service-card">
                            <h4 class="service-name">Service Selection</h4>
                            <ul class="interview-q">
                                <li>When would you use SageMaker vs Bedrock vs pre-built services?</li>
                                <li>How do you decide between Lambda and EC2 for ML inference?</li>
                                <li>Compare S3, EFS, and EBS for ML data storage</li>
                            </ul>
                        </div>
                        
                        <div class="service-card">
                            <h4 class="service-name">Cost Optimization</h4>
                            <ul class="interview-q">
                                <li>How do you optimize SageMaker training costs?</li>
                                <li>Explain S3 storage classes and when to use each</li>
                                <li>What are the cost implications of real-time vs batch inference?</li>
                            </ul>
                        </div>
                        
                        <div class="service-card">
                            <h4 class="service-name">Architecture</h4>
                            <ul class="interview-q">
                                <li>Design a scalable ML inference API on AWS</li>
                                <li>How would you build a RAG system using AWS services?</li>
                                <li>Architect a real-time CV system processing video streams</li>
                            </ul>
                        </div>
                        
                        <div class="aws-box" class="stack">
                            <h4 class="section-title aws">💡 Tips for AWS AI/ML Engineer Interviews</h4>
                            <div >
                                <strong class="label">Before the Interview:</strong>
                                <ul >
                                    <li>Get AWS Certified Solutions Architect Associate</li>
                                    <li>Consider AWS Machine Learning Specialty certification</li>
                                    <li>Build 2-3 projects deployed on AWS</li>
                                    <li>Know AWS Free Tier and cost optimization</li>
                                </ul>
                            </div>
                            <div>
                                <strong class="label">During Technical Interviews:</strong>
                                <ul >
                                    <li>Always mention cost implications</li>
                                    <li>Discuss trade-offs between services</li>
                                    <li>Show security best practices awareness</li>
                                    <li>Mention monitoring and observability</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Event handlers
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + '-content').classList.add('active');
        }
        
        function toggleTopic(id) {
            const topic = document.getElementById(id);
            topic.classList.toggle('expanded');
        }
        
        // Initialize
        renderRoadmap();
        renderAWS();
    </script>
</body>
</html>
