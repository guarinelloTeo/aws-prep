<!DOCTYPE html>
<html lang="en">
<head>

    <title>AI Engineer Roadmap 2026 - AWS Focus</title>
    <style>

        :root {
            --bg: #f4efe7;
            --ink: #1c1915;
            --muted: #615b53;
            --line: #e6ddd0;
            --card: rgba(255, 252, 248, 0.92);
            --accent: #c2410c;

            --green: #166534;
            --green-soft: #ecf8f1;
            --amber: #92400e;
            --amber-soft: #fff7eb;
            --shadow: 0 20px 50px rgba(58, 36, 14, 0.07);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Outfit, sans-serif;
            color: var(--ink);
            line-height: 1.6;
            min-height: 100vh;
            background:
                radial-gradient(900px 420px at -10% -10%, #ffd8bf 0%, transparent 60%),
                radial-gradient(800px 380px at 110% -20%, #efe4ff 0%, transparent 55%),

            padding: 28px 18px 80px;
        }

        .container { max-width: 920px; margin: 0 auto; }

        .hero { padding: 18px 6px 8px; }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 14px;
        }

        h1 {
            font-family: Fraunces, serif;
            font-size: clamp(2.6rem, 6vw, 4.4rem);
            font-weight: 560;
            letter-spacing: -0.045em;
            line-height: 0.95;
            color: var(--ink);
            max-width: 12ch;
        }

        .subtitle {
            margin-top: 18px;
            max-width: 42rem;
            font-size: 1.12rem;
            color: var(--muted);
        }

        .tabs {
            position: sticky;
            top: 14px;
            z-index: 20;
            display: flex;
            gap: 6px;
            width: fit-content;
            max-width: 100%;
            margin: 28px 0 22px;
            padding: 6px;
            background: rgba(255, 252, 248, 0.82);
            border: 1px solid var(--line);
            border-radius: 999px;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 24px rgba(58, 36, 14, 0.06);
        }

        .tab-btn {
            border: 0;
            background: transparent;
            color: var(--muted);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--ink);
            color: #fffaf5;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .level-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: var(--shadow);
        }

        .level-header {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .level-num {
            flex: 0 0 auto;
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: var(--ink);
            color: #fffaf5;
            font-family: Fraunces, serif;
            font-size: 1.15rem;
        }

        .level-title {
            font-family: Fraunces, serif;
            font-size: 1.7rem;
            font-weight: 560;
            letter-spacing: -0.03em;
            color: var(--ink);
            line-height: 1.1;
        }

        .level-desc { color: var(--muted); margin-top: 4px; }

        .badge {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.82rem;
            font-weight: 600;
        }

        .topic {
            margin-top: 10px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            overflow: hidden;
        }

        .topic-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.02rem;
            color: var(--ink);
        }

        .topic-title:hover { background: #faf7f2; }

        .arrow {
            width: 9px;
            height: 9px;
            border-right: 2px solid #8a8178;
            border-bottom: 2px solid #8a8178;
            transform: rotate(-45deg);
            transition: transform 0.2s ease;
            flex: 0 0 auto;
        }

        .topic.expanded .arrow { transform: rotate(45deg); }

        .topic-content { display: none; padding: 0 16px 16px; }
        .topic.expanded .topic-content { display: block; }

        .section { margin-top: 14px; }

        .section-title {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .section-title.interview { color: var(--amber); }
        .section-title.tips { color: var(--green); }
        .section-title.aws { color: var(--accent); }

        ul { list-style: none; }

        li {
            position: relative;
            padding: 7px 0 7px 16px;
            color: #2c2824;
        }

        li:before {
            content: "";
            position: absolute;
            left: 0;
            top: 0.85em;
            width: 6px;
            height: 6px;
            border-radius: 99px;
            background: #d6cfc4;
        }

        .interview-q:before { background: #d97706; }
        .tip:before { background: #16a34a; }
        .aws-item:before { background: var(--accent); }

        .aws-box, .when {
            margin-top: 14px;
            padding: 14px 14px 6px;
            border-radius: 14px;
            background: var(--accent-soft);
        }

        .when {
            padding: 12px 14px;
            color: #7c2d12;
            background: var(--green-soft);
            color: var(--green);
        }

        .group-title {
            margin: 26px 0 12px;
            font-family: Fraunces, serif;
            font-size: 1.45rem;
            letter-spacing: -0.03em;
        }

        .service-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .service-name {
            font-family: Fraunces, serif;
            font-size: 1.35rem;
            letter-spacing: -0.03em;
        }

        .service-purpose { color: var(--muted); margin: 2px 0 10px; }

        .label { color: var(--ink); font-weight: 700; }

        .color-blue, .color-green, .color-yellow, .color-red,
        .color-purple, .color-cyan, .color-orange, .color-pink { color: var(--ink); }

        @media (max-width: 700px) {
            body { padding: 16px 12px 48px; }
            .level-card { padding: 16px; border-radius: 18px; }
            .tabs { width: 100%; }
            .tab-btn { flex: 1; }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
